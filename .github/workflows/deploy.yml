name: Deploy

# Builds the new UI and deploys it, with the chat service, to the homelab Traccar
# (domasskirgaila/homelab-traccar serves ./web and runs the traccar-chat container).

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build new UI
        run: npm run build
        env:
          VITE_NEW_UI: '1'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      # Plain ssh, so every failure is reported as an annotation on the run.
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::The SSH_PRIVATE_KEY secret is missing in this repository"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Keys copied on Windows can carry CRLF line endings, which ssh rejects.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key without a passphrase"
            exit 1
          fi
          cat > ~/.ssh/config <<'EOF'
          Host homelab
            HostName 100.84.231.107
            User domdom
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
          EOF
          if ! ssh homelab true; then
            echo "::error::SSH login to domdom@100.84.231.107 failed (key not authorized or host unreachable)"
            exit 1
          fi

      - name: Upload web UI and chat service
        run: |
          ssh homelab 'rm -rf ~/traccar-web-deploy && mkdir -p ~/traccar-web-deploy'
          tar -czf - build tools/chat-service | ssh homelab 'tar -xzf - -C ~/traccar-web-deploy'

      - name: Deploy to homelab
        run: |
          ssh homelab 'bash -s' <<'EOF' || { echo "::error::Deployment on the homelab failed"; exit 1; }
          set -e
          src=~/traccar-web-deploy
          cd /opt/traccar
          mkdir -p web
          # Replace the files in place: the Traccar container bind-mounts this directory.
          find web -mindepth 1 -delete
          cp -a "$src/build/." web/
          docker build -q -t traccar-chat:latest "$src/tools/chat-service"
          # Until homelab-traccar defines the service there is nothing to restart.
          if docker compose config --services | grep -qx traccar-chat; then
            docker compose up -d traccar-chat
          fi
          EOF
